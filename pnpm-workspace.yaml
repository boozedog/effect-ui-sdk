packages:
  - packages/*
  - examples/*

# One Vite for the site and for Vitest, pinned below the release age the local
# policy enforces so a frozen-lockfile install passes on a fresh checkout.
overrides:
  vite: 8.3.8

# `effect@4.1.6` is newer than the default release-age policy on the machine
# that wrote this lockfile. CI installs from the committed lockfile, so the pin
# stays exact and reproducible.
minimumReleaseAgeExclude:
  - effect@4.1.6
  - daisyui@5.8.3

onlyBuiltDependencies:
  - esbuild
