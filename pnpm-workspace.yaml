packages:
  - packages/*
  - examples/*

# One Vite for the site and for Vitest, pinned below the release age the local
# policy enforces so a frozen-lockfile install passes on a fresh checkout.
overrides:
  vite: 8.4.0

# Recently published versions can be newer than the local release-age policy.
# CI installs from the committed lockfile, so pins stay reproducible.
minimumReleaseAgeExclude:
  - effect@4.1.7
  - daisyui@5.8.3
  - vite@8.4.0
  - "@ui-sdk/web@0.1.0-beta.18"
  - "@ui-sdk/core@0.1.0-beta.18"

onlyBuiltDependencies:
  - esbuild
