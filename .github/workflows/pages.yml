name: Pages

on:
  # Build and deploy the catalog from master only. Nothing here pushes to
  # master: the deployment is a Pages artifact, not a commit.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time. Queuing rather than cancelling keeps a
# run that is already uploading from being cut off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the catalog
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: examples/site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
