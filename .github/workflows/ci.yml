name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to a pull request cancels the run it replaces. A push to master
# always runs, since it is what the deployed site was built from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The bindings are generated from @ui-sdk/web's manifest. A stale commit
      # means someone bumped the dependency without regenerating.
      - name: Check generated bindings
        run: pnpm check:generated

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The site is Vite + Tailwind. Building it here catches build-only
      # regressions (CSS pipeline, config, imports) that typecheck and tests miss.
      - name: Build site
        run: pnpm build
